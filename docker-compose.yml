services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lenny-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lenny
      POSTGRES_PASSWORD: lenny_dev_password
      POSTGRES_DB: lenny_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lenny -d lenny_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: lenny-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://lenny:lenny_dev_password@postgres:5432/lenny_assistant
      MODEL_PROVIDER: ollama
      OLLAMA_MODEL: llama3.2:3b
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: lenny-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
